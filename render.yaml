# Render.com blueprint: one same-origin Node service + managed PostgreSQL.
# Fastify serves /api/* and the built Vite assets from the same origin (no CORS).
#
# Free tier: preDeployCommand is not supported — migrate + seed run via start:render.
# Railway equivalent: build → release (migrate + seed) → start.
services:
  - type: web
    name: distil
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
      - key: PROCESSING_DELAY_MS
        value: "100"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: distil-db
          property: connectionString

databases:
  - name: distil-db
    plan: free
    postgresMajorVersion: "16"
