services:
  db:
    image: postgres:16-alpine
    container_name: distil_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: distil
      POSTGRES_PASSWORD: distil
      POSTGRES_DB: distil
    ports:
      - "5432:5432"
    volumes:
      - distil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distil -d distil"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  distil_pgdata:
