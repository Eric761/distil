# Keeps the free-tier Render web service warm so visitors rarely hit a cold start.
#
# Render spins a Free web service down after ~15 minutes with no inbound traffic;
# waking it shows Render's own loading page for ~1 minute. Pinging /api/ping every
# 10 minutes leaves a safety margin under that 15-minute window.
#
# The real keep-alive here is an external monitor (UptimeRobot / cron-job.org)
# hitting /api/ping every ≤10 min — that does not depend on GitHub's scheduler and
# is the most reliable free option. This workflow is a best-effort secondary and a
# manual "wake it now" button.
#
# IMPORTANT: KEEP_ALIVE_URL must point at the LIVE service host. The correct host is
# https://distil-mq5q.onrender.com (see Render dashboard → distil → URL under the
# service name). A wrong host returns 404 with header "x-render-routing: no-server".
# Override without editing this file via repo variable KEEP_ALIVE_URL.
#
# Free-tier note: keeping one service warm ~24/7 uses most of Render's 750 free
# instance-hours/month; if exhausted, Render suspends the service until month reset.
name: keep-alive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/keep-alive.yml
  schedule:
    # Best-effort only (UTC). GitHub free cron is unreliable/sparse; rely on an
    # external monitor for the true 10-minute cadence.
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/ping until warm
        env:
          KEEP_ALIVE_URL: ${{ vars.KEEP_ALIVE_URL || 'https://distil-mq5q.onrender.com/api/ping' }}
        run: |
          set -euo pipefail
          echo "event=${{ github.event_name }} url=$KEEP_ALIVE_URL"
          # Retry for ~2 minutes to absorb a cold start (Render wake ~1 min).
          for attempt in $(seq 1 8); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$KEEP_ALIVE_URL" || echo 000)"
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Service is warm."
              exit 0
            fi
            sleep 15
          done
          echo "::error::$KEEP_ALIVE_URL did not return 200. A 404 with 'x-render-routing: no-server' means the URL is wrong — check the live host in the Render dashboard." >&2
          exit 1
